[project]
name = "projet-05-vision-fish-detection"
version = "0.1.0"
description = "Détection d'espèces de poissons par fine-tuning de Faster R-CNN — réécriture pro du Projet 05."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "torchmetrics>=1.3",
    "kagglehub>=0.3",
    "pandas-stubs~=3.0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
