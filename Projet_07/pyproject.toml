[project]
name = "projet-07-agent-voyage"
version = "0.1.0"
description = "Agent IA qui planifie des vacances (SQL + embeddings + boucle de décision) — réécriture pro du Projet 07."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pypdf>=4.0",
    "sentence-transformers>=3.0",
    "streamlit>=1.35",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pandas-stubs~=3.0.5",
    "pytest>=9.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
